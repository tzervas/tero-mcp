# Fleet standard CI — self-hosted. Honest status on trunk via Actions badge.
# See docs/FLEET_STANDARDS.md (or plans/fractal/P26_FLEET_STANDARDS.md).
# Host placement: CPU on homelab (not WSL). WSL is GPU-only.
name: fleet-ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: detect stack
    runs-on: [self-hosted, linux, x64, podman, compute-cpu, host-homelab, scribe-cpu-build]
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - id: d
        run: |
          set -euo pipefail
          rust=false; python=false
          # tero-mcp keeps the engine under rust/ (no root Cargo.toml)
          if [ -f Cargo.toml ] || [ -f rust/Cargo.toml ]; then rust=true; fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then python=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected rust=$rust python=$python"

  rust:
    name: cargo check/test
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman, compute-cpu, host-homelab, scribe-cpu-build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure cargo on PATH
        run: |
          set -euo pipefail
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            # shellcheck disable=SC1091
            . "${CARGO_HOME:-$HOME/.cargo}/env"
          fi
          rustc --version
          cargo --version
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: cargo check
        # engine crate lives in rust/ for this repo; fall back to workspace root
        run: |
          set -euo pipefail
          if [ -f rust/Cargo.toml ]; then
            (cd rust && cargo check --workspace --all-targets)
          else
            cargo check --workspace --all-targets
          fi
      - name: cargo test
        run: |
          set -euo pipefail
          if [ -f rust/Cargo.toml ]; then
            (cd rust && cargo test --workspace)
          else
            cargo test --workspace
          fi

  python:
    name: python lint/test
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, podman, compute-cpu, host-homelab, scribe-cpu-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"
          # self-hosted: local uv cache is enough; GH Actions cache post often stalls
          enable-cache: false
      - name: Sync (best-effort)
        run: |
          set -euo pipefail
          if [ -f uv.lock ] || [ -f pyproject.toml ]; then
            uv sync --all-groups 2>/dev/null || uv sync 2>/dev/null || true
          fi
      - name: Ruff (if configured)
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -q '\[tool.ruff' pyproject.toml 2>/dev/null; then
            uv run ruff check . || python -m ruff check .
          else
            echo "ruff not configured — skip"
          fi
      - name: Pytest (if tests exist)
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ]; then
            # Decide the runner UP FRONT. Never fall back on an exit code: || fires on any
            # non-zero, so `uv run pytest || pytest` retries in a different environment when the
            # first run failed *because tests failed*, and a pass there greens a red suite.
            if command -v uv >/dev/null 2>&1 && { [ -f uv.lock ] || [ -f pyproject.toml ]; }; then
              RUN="uv run pytest"
            else
              RUN="pytest"
            fi
            # No 2>/dev/null: a CI log is where stderr belongs, and discarding it makes
            # "tests failed" indistinguishable from "pytest is absent".
            $RUN -q
          else
            echo "no tests/ directory — skip"
          fi

  noop:
    name: no stack detected
    needs: detect
    if: needs.detect.outputs.rust != 'true' && needs.detect.outputs.python != 'true'
    runs-on: [self-hosted, linux, x64, podman, compute-cpu, host-homelab, scribe-cpu-build]
    timeout-minutes: 20
    steps:
      - run: |
          echo "No Cargo.toml / pyproject detected. fleet-ci reports success with no gates."
          echo "Add stack files or a product-specific CI job for real coverage."
