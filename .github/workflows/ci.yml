name: CI

# Triggered on push/PR; also manual. Local parity: ./scripts/check.sh
# CPU on homelab (host-homelab + scribe-cpu-build). WSL is GPU-only — do not schedule CPU here.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Local-parity checks
    runs-on: [self-hosted, linux, x64, podman, compute-cpu, host-homelab, scribe-cpu-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Local-parity checks
        run: bash scripts/check.sh
